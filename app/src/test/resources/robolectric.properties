# Robolectric emulates the Android framework by reimplementing its internals, so it can
# only run on SDK levels it has shipped support for. The app compiles and targets SDK 37,
# but Robolectric 4.17 cannot build a sandbox for it (it fails inside SDK 37's new
# ApplicationSharedMemory). Pinning the JVM tests to SDK 34 keeps them running; nothing
# under test here is SDK-37 specific, and device-specific behaviour is covered by the
# instrumentation tests instead.
sdk=34
