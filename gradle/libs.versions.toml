# Version catalog.
# Every version here was verified as resolvable against Google Maven / Maven Central
# before being written down (see README "Build instructions").
[versions]
agp = "9.4.1"
# Kotlin version used by the Compose compiler plugin. Must track the Kotlin that AGP 9
# bundles for its built-in Kotlin support (currently 2.4.20).
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"

compileSdk = "37"
minSdk = "26"
targetSdk = "37"

composeBom = "2026.09.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.12.4"
navigationCompose = "2.10.1"
room = "2.8.5"
datastore = "1.2.1"
coroutines = "1.11.0"
hiltNavigationCompose = "1.4.0"
exifinterface = "1.4.2"
documentfile = "1.1.0"

mlkitTextRecognition = "16.0.1"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
genaiCommon = "1.0.0-beta4"
genaiPrompt = "1.0.0-beta4"
genaiSummarization = "1.0.0-beta1"
genaiRewriting = "1.0.0-beta1"
genaiProofreading = "1.0.0-beta1"
genaiImageDescription = "1.0.0-beta1"
genaiSpeechRecognition = "1.0.0-alpha1"

junit = "4.13.2"
androidxTestExt = "1.3.0"
espresso = "3.7.0"
truth = "1.4.5"
turbine = "1.2.1"
robolectric = "4.17"
androidxTestCore = "1.7.0"
ossLicensesPlugin = "0.13.0"
ossLicenses = "17.5.2"

[libraries]
oss-licenses = { module = "com.google.android.gms:play-services-oss-licenses", version.ref = "ossLicenses" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { module = "com.google.mlkit:language-id", version.ref = "mlkitLanguageId" }
mlkit-genai-common = { module = "com.google.mlkit:genai-common", version.ref = "genaiCommon" }
mlkit-genai-prompt = { module = "com.google.mlkit:genai-prompt", version.ref = "genaiPrompt" }
mlkit-genai-summarization = { module = "com.google.mlkit:genai-summarization", version.ref = "genaiSummarization" }
mlkit-genai-rewriting = { module = "com.google.mlkit:genai-rewriting", version.ref = "genaiRewriting" }
mlkit-genai-proofreading = { module = "com.google.mlkit:genai-proofreading", version.ref = "genaiProofreading" }
mlkit-genai-image-description = { module = "com.google.mlkit:genai-image-description", version.ref = "genaiImageDescription" }
mlkit-genai-speech-recognition = { module = "com.google.mlkit:genai-speech-recognition", version.ref = "genaiSpeechRecognition" }

junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
